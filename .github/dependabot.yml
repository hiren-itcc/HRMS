version: 2
updates:
  # Grouped, because ungrouped Dependabot on a pnpm monorepo opens a dozen PRs
  # a week and everybody stops reading them — which is worse than not running it.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
