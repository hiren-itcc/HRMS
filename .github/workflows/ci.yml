name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hrms"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hrms/api db:generate

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test -- --passWithNoTests

      - name: Migration drift check
        # Applies every migration to a shadow DB and diffs against the schema —
        # catches both drift and migrations that fail to apply.
        env:
          SHADOW_DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms_shadow
        run: |
          PGPASSWORD=hrms createdb -h localhost -U hrms hrms_shadow
          pnpm --filter @hrms/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code || (echo "::error::schema.prisma has changes not captured in a migration" && exit 1)
