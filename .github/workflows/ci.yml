name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build/typecheck-only values — validated shape, never used against a real service
      DATABASE_URL: postgresql://hrms:hrms@localhost:5432/hrms?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-0000000000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @hrms/api db:generate

      - name: Lint (Biome)
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Build
        run: pnpm turbo run build

      - name: Test
        run: pnpm turbo run test -- --passWithNoTests

      - name: Migration drift check
        run: |
          pnpm --filter @hrms/api exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code || (echo "::error::schema.prisma has changes not captured in a migration" && exit 1)
