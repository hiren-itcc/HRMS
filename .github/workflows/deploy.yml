name: Deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.app }}.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Staging/production rollout (docs/10-engineering-standards.md §CI/CD):
  # ssh → compose pull → prisma migrate deploy → compose up -d → smoke check.
  # Enabled once a server exists — requires DEPLOY_HOST/DEPLOY_KEY secrets and
  # a GitHub Environment ("production") with required reviewers.
  deploy:
    needs: build-images
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out over SSH
        run: echo "Configure DEPLOY_HOST/DEPLOY_KEY and replace this step per docs/10-engineering-standards.md"
