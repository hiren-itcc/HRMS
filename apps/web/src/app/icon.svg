<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HRMS">
  <title>HRMS</title>
  <!--
    The brand mark, flattened for 16 pixels.

    The `d` below is byte-identical to `BRAND_PATH` in
    `src/components/brand-mark.tsx`, and `brand-mark.test.tsx` fails if it ever
    stops being. It has to be duplicated — Next serves this file statically, so
    it cannot import anything — and the previous pair drifted apart precisely
    because a comment was the only thing holding them together.

    Two differences from the component, both forced by the medium:

    - The gradient is spelled out in hex. A favicon reads no CSS variables, so
      it cannot follow the `brand-ramp` custom properties through the five
      alternate themes and stays the default terracotta. That is the right
      trade: the tab icon identifies the product, not the viewer's colour
      preference.
    - The stops are the compiled values of `brand-ramp` 1, 2 and 3 from
      `packages/ui/src/styles/globals.css`. If that ramp moves, these move.

    Those names are written without their leading dashes on purpose. An XML
    comment may not contain a double hyphen anywhere inside it, and a
    standalone .svg is parsed as XML, not HTML — spelling the custom properties
    in full here makes the whole file unrenderable while still linting clean
    and still serving as image/svg+xml.

    White on all three stops measures 7.07 / 5.61 / 4.53 against white, so the
    glyph clears AA everywhere on the tile.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#923f33" />
      <stop offset="55%" stop-color="#aa4a30" />
      <stop offset="100%" stop-color="#bc5a31" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#brand)" />
  <g transform="translate(5.2 5.2) scale(0.9)">
    <path
      fill="#ffffff"
      fill-rule="evenodd"
      d="M9 5.9a3 3 0 1 0 6 0 3 3 0 1 0-6 0ZM1.8 8.4a2.2 2.2 0 1 0 4.4 0 2.2 2.2 0 1 0-4.4 0ZM17.8 8.4a2.2 2.2 0 1 0 4.4 0 2.2 2.2 0 1 0-4.4 0ZM1.6 19.3v-5.7a1.9 1.9 0 0 1 1.9-1.9h1a1.9 1.9 0 0 1 1.9 1.9v5.7a1.1 1.1 0 0 1-1.1 1.1H2.7a1.1 1.1 0 0 1-1.1-1.1ZM17.6 19.3v-5.7a1.9 1.9 0 0 1 1.9-1.9h1a1.9 1.9 0 0 1 1.9 1.9v5.7a1.1 1.1 0 0 1-1.1 1.1H18.7a1.1 1.1 0 0 1-1.1-1.1ZM9.7 12.5v-1.3a1.5 1.5 0 0 1 1.5-1.5h1.6a1.5 1.5 0 0 1 1.5 1.5v1.3ZM11.1 12.5v-1.2a.4.4 0 0 1 .4-.4h1a.4.4 0 0 1 .4.4v1.2ZM8.8 12.5h6.4a1.6 1.6 0 0 1 1.6 1.6v4.7a1.6 1.6 0 0 1-1.6 1.6H8.8a1.6 1.6 0 0 1-1.6-1.6v-4.7a1.6 1.6 0 0 1 1.6-1.6Z"
    />
  </g>
</svg>
