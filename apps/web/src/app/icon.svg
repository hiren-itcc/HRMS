<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="HRMS">
  <title>HRMS</title>
  <!--
    The sidebar's brand mark, flattened for 16 pixels. `app-sidebar.tsx` draws
    a stroked lucide ShieldCheck on .gradient-primary; a 2px stroke turns to
    mush in a browser tab, so the shield is filled solid here and the tick is
    cut out of it in the background colour. Same mark, legible small.
    Gradient stops are the .gradient-primary terracotta from
    packages/ui/src/styles/globals.css.
  -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#923f33" />
      <stop offset="55%" stop-color="#aa4a30" />
      <stop offset="100%" stop-color="#bc5a31" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#brand)" />
  <g transform="translate(5.2 5.2) scale(0.9)">
    <path
      fill="#ffffff"
      d="M20 13c0 5-3.5 7.5-7.68 8.95a1 1 0 0 1-.63-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"
    />
    <path
      d="m9 12 2 2 4-4"
      fill="none"
      stroke="#a8492f"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
