packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msw: set this to true or false
  prisma: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# Transitive dependencies pinned past a published advisory.
#
# Every one of these arrives through something else — postcss and sharp through
# Next.js, js-yaml through tooling, fast-uri through the JSON-schema stack — so
# there is no direct dependency to bump and an override is the only lever.
#
# All are within-major bumps, which is what makes this low risk: they are the
# patch releases the advisories themselves name, not upgrades. js-yaml needs
# three separate entries because three majors are installed at once and the
# fix was published for each.
#
# Reviewed rather than blanket-pinned: `pnpm audit` reported ten advisories,
# eight of them high, and each line below corresponds to one of them.
overrides:
  postcss: '^8.5.25'
  sharp: '^0.35.0'
  fast-uri: '^3.1.5'
  nanoid: '^3.3.17'
  js-yaml@3: '^3.15.1'
  js-yaml@4: '^4.3.1'
  js-yaml@5: '^5.2.2'
